<!DOCTYPE html>
<html lang="{% block language %}zh-CN{% endblock %}">

<head>
    <meta charset="utf-8">
    {% if private_preview %}
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    {% endif %}
    <title>{{ name }}'s Resume</title>
    <meta name="description" content="{{ meta_content }}">
    <meta name="keywords" content="{{ keywords }}">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="assets/styles.css?v={{ asset_version }}">
    {% if ga_id %}
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ ga_id }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', '{{ ga_id }}');
    </script>
    {% endif %}
</head>

<body class="{% block body_class %}{% endblock %}">
<div class="site">
    {% block main %}{% endblock %}
</div>
<footer>
    <div class="footer-actions">
        <a class="pdf-export-button" href="./{{ print_page }}?autoprint=1" target="_blank" rel="noopener">
            <em class="fa fa-file-pdf-o"></em>{% block pdf_label %}{{ pdf_export_text }}{% endblock %}
        </a>
    </div>
    <p>
        Last updated on: {{ update_time }}.
        {% if not private_preview %}<a href="./index.html">中文</a>
        <a href="./index-en.html">English</a>{% endif %}
    </p>
</footer>
<script src="assets/scripts.js?v={{ asset_version }}"></script>
</body>
</html>
