name: Resume rendering checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  rendering:
    # Playwright 1.56.1 supports Ubuntu 24.04, not the moving latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: npm run test:browser
      - run: npm run test:workspace-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-rendering
          path: |
            test-results/
            dist/*.html
            dist/assets/styles.css
            dist/assets/scripts.js
          if-no-files-found: ignore
